name: SafelyGo checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: safelygo
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: safelygo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            mobile/package-lock.json
      - run: npm ci --prefix server && npm ci --prefix mobile
      - run: npm run check && npm --prefix mobile run lint
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://safelygo:test-only-password@localhost:5432/safelygo_test
      - run: npm run build:api && npm --prefix mobile run export:all
